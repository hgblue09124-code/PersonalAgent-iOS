name: Apple Native Build & Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apple-build:
    name: macOS Xcode iOS arm64 Build & Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build PersonalAgent iOS app target (arm64)
        run: |
          xcodebuild build \
            -project PersonalAgent.xcodeproj \
            -scheme PersonalAgent \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Development IPA Artifact
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData ~/Library/Developer/Xcode/DerivedData -name "PersonalAgent.app" -type d 2>/dev/null | head -n 1)
          test -n "$APP_PATH" || (echo "Error: PersonalAgent.app not found" && false)
          cp -R "$APP_PATH" Payload/
          zip -r -y PersonalAgent-unsigned.ipa Payload
          test -f PersonalAgent-unsigned.ipa
          file PersonalAgent-unsigned.ipa
          unzip -t PersonalAgent-unsigned.ipa
          unzip -l PersonalAgent-unsigned.ipa | grep -F "Payload/PersonalAgent.app/"
          test -d Payload/PersonalAgent.app
          echo "Created and verified PersonalAgent-unsigned.ipa successfully"

      - name: Upload Unsigned Development IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-iOS-unsigned-IPA
          path: PersonalAgent-unsigned.ipa
          retention-days: 14


      - name: Publish Pre-release IPA
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::12}"
          gh release create "$TAG" PersonalAgent-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dev IPA · PR #${{ github.event.pull_request.number }} · ${GITHUB_SHA::12}" \
            --notes "Unsigned development IPA generated from PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}. Verify on physical device before merge." \
            --prerelease
