name: Apple Native Build & Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apple-build:
    name: macOS Xcode iOS arm64 Build & Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build PersonalAgent iOS app target (arm64)
        run: |
          xcodebuild build \
            -project PersonalAgent.xcodeproj \
            -scheme PersonalAgent \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Development IPA Artifact
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData ~/Library/Developer/Xcode/DerivedData -name "PersonalAgent.app" -type d 2>/dev/null | head -n 1)
          test -n "$APP_PATH" || (echo "Error: PersonalAgent.app not found" && false)
          cp -R "$APP_PATH" Payload/
          zip -r PersonalAgent-unsigned.ipa Payload
          echo "Created PersonalAgent-unsigned.ipa successfully"

      - name: Upload Unsigned Development IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PersonalAgent-iOS-unsigned-IPA
          path: PersonalAgent-unsigned.ipa
          retention-days: 14
