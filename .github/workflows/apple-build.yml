name: Apple Native Build & Unsigned IPA

on:
  push:
    branches: [main, ui/agent-orb-real-glass, ui/native-agent-surface]
  pull_request:

permissions:
  contents: write

jobs:
  apple-build:
    name: macOS Xcode iOS arm64 Build & Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Normalize AppIcon image for asset catalog
        run: |
          APP_ICON="App/PersonalAgent/Assets.xcassets/AppIcon.appiconset/AppIcon.jpg"
          test -f "$APP_ICON"
          sips -Z 1024 "$APP_ICON"
          sips -g pixelWidth -g pixelHeight "$APP_ICON"

      - name: Resolve Pre-release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/native-agent-surface'
        run: |
          BASE_VERSION=$(grep -m1 'MARKETING_VERSION = ' PersonalAgent.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = //; s/;//')
          IFS='.' read -r MAJOR MINOR BASE_PATCH <<< "$BASE_VERSION"
          NEXT_PATCH=$((BASE_PATCH + 1))
          for TAG in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            if [[ "$TAG" =~ ^dev-v${MAJOR}.${MINOR}.([0-9]+)- ]]; then
              PATCH="${BASH_REMATCH[1]}"
              if (( PATCH >= NEXT_PATCH )); then NEXT_PATCH=$((PATCH + 1)); fi
            fi
          done
          VERSION="$MAJOR.$MINOR.$NEXT_PATCH"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Pre-release version: $VERSION"

      - name: Build PersonalAgent iOS app target (arm64)
        run: |
          xcodebuild build \
            -project PersonalAgent.xcodeproj \
            -scheme PersonalAgent \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath DerivedData \
            MARKETING_VERSION="${APP_VERSION:-0.1.0}" \
            PA_PRE_RELEASE_CHANNEL="${{ github.event_name == 'pull_request' && format('dev-pr-{0}', github.event.pull_request.number) || '' }}" \
            PA_PRE_RELEASE_CODE="${GITHUB_SHA::12}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned Development IPA Artifact
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData ~/Library/Developer/Xcode/DerivedData -name "PersonalAgent.app" -type d 2>/dev/null | head -n 1)
          test -n "$APP_PATH" || (echo "Error: PersonalAgent.app not found" && false)
          cp -R "$APP_PATH" Payload/
          zip -r -y PersonalAgent-unsigned.ipa Payload
          test -f PersonalAgent-unsigned.ipa
          file PersonalAgent-unsigned.ipa
          unzip -t PersonalAgent-unsigned.ipa
          unzip -l PersonalAgent-unsigned.ipa | grep -F "Payload/PersonalAgent.app/"
          test -d Payload/PersonalAgent.app
          echo "Created and verified PersonalAgent-unsigned.ipa successfully"

      - name: Upload Unsigned Development IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-iOS-unsigned-IPA
          path: PersonalAgent-unsigned.ipa
          retention-days: 14

      - name: Publish PR Pre-release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-pr-${{ github.event.pull_request.number }}"
          TITLE="PR #${{ github.event.pull_request.number }} · Dev IPA · ${GITHUB_SHA::12}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --target "$GITHUB_SHA" --prerelease --latest=false
            gh release upload "$TAG" PersonalAgent-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" PersonalAgent-unsigned.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --latest=false \
              --notes "Unsigned development IPA for PR #${{ github.event.pull_request.number }}. The asset is replaced on every successful build."
          fi

      - name: Publish branch Pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/native-agent-surface'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-v${APP_VERSION}-${GITHUB_SHA::12}"
          gh release create "$TAG" PersonalAgent-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dev IPA · v${APP_VERSION} · ${GITHUB_SHA::12}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Unsigned development IPA v${APP_VERSION} generated at $GITHUB_SHA. Verify on physical device before merge."

      # PR workflows also keep the verified IPA as an Actions artifact.
      # Same-repository PRs additionally receive a direct .ipa release asset.
      # Fork PRs stay artifact-only because pull_request tokens must not publish releases.
