name: Agent Task Contract
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".agentos/**"
      - "Tasks/**"
      - "Scripts/agent_task_guard.py"
      - ".github/workflows/agent-task-contract.yml"
permissions:
  contents: read
jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate example contract
        run: python Scripts/agent_task_guard.py validate .agentos/task.example.json
      - name: Compile validator
        run: python -m py_compile Scripts/agent_task_guard.py
      - name: Require and validate task contract for changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          changed_paths="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          mapfile -t task_files < <(printf '%s\n' "$changed_paths" | grep -E '^Tasks/active/[^/]+\.json$' || true)

          if [ "${#task_files[@]}" -eq 0 ]; then
            non_documentation="$(printf '%s\n' "$changed_paths" | grep -Ev '^(Documentation/|README(\.[^/]*)?$|CHANGELOG(\.[^/]*)?$|LICENSE$)' | grep -v '^$' || true)"
            if [ -n "$non_documentation" ]; then
              echo "::error::Code, tests, configuration, and workflow changes require exactly one Tasks/active/*.json contract."
              printf '%s\n' "$non_documentation"
              exit 1
            fi
            echo "Documentation-only pull request; no task contract required."
            exit 0
          fi

          if [ "${#task_files[@]}" -ne 1 ]; then
            echo "::error::Exactly one Tasks/active/*.json contract must change per logical task."
            printf '%s\n' "${task_files[@]}"
            exit 1
          fi

          task_file="${task_files[0]}"
          python Scripts/agent_task_guard.py validate "$task_file"
          python Scripts/agent_task_guard.py check-diff "$task_file" --base "origin/${{ github.base_ref }}"
