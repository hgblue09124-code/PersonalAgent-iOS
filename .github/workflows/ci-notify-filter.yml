name: PR Final — Filter
run-name: PR Final — ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-filter:
    name: PR-FINAL-FILTER
    runs-on: ubuntu-24.04
    steps:
      - name: Emit stable CI notification key
        run: |
          echo "CI_NOTIFY_KEY=personalagent-ci"
          echo "CI_NOTIFY_WORKFLOW=PR Final — ${{ github.head_ref || github.ref_name }}"
          echo "CI_NOTIFY_STATUS=started"
