name: CI — Full Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    name: Swift package tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.2
    steps:
      - uses: actions/checkout@v5
      - name: Run contract, kernel, provider, and module tests
        run: swift test --disable-sandbox

  repository-integrity:
    name: Repository integrity greps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: KernelSession is in the Xcode sources phase
        run: |
          grep -q "KernelSession.swift in Sources" PersonalAgent.xcodeproj/project.pbxproj
      - name: App target does not link PAMemory
        run: |
          if grep -q "productName = PAMemory" PersonalAgent.xcodeproj/project.pbxproj; then
            echo "PAMemory must not be an app product dependency"
            exit 1
          fi
      - name: App target does not link concrete providers
        run: |
          for name in PAProvidersGrok PAProvidersOpenAI PAProvidersOpenAICompatible PAProvidersLocal; do
            if grep -q "productName = ${name}" PersonalAgent.xcodeproj/project.pbxproj; then
              echo "App must not link ${name}"
              exit 1
            fi
          done
      - name: M1 and M2 test sources are present
        run: |
          test -f Tests/PersonalAgentTests/M1LifecycleTests.swift
          test -f Tests/PersonalAgentTests/M1GoalTests.swift
          test -f Tests/PersonalAgentTests/M1EventDeterminismTests.swift
          test -f Tests/PersonalAgentTests/M1ConcurrencyTests.swift
          test -f Tests/PersonalAgentTests/M1CompositionTests.swift
          test -f Tests/PersonalAgentTests/M2ContractTests.swift
          test -f Tests/PersonalAgentTests/M2LifecycleTests.swift
          test -f Tests/PersonalAgentTests/M2FakeProviderTests.swift
          test -f Tests/PersonalAgentTests/M2AdapterFixtureTests.swift
          test -f Tests/PersonalAgentTests/M2SecurityTests.swift
          test -f Tests/PersonalAgentTests/M2ConcurrencyTests.swift
          test -f Tests/PersonalAgentTests/M2IsolationTests.swift
          test -f Tests/PersonalAgentTests/M2CompositionTests.swift
          test -f Tests/PersonalAgentTests/M3ContractTests.swift
          test -f Tests/PersonalAgentTests/M3RuntimeTests.swift
          test -f Tests/PersonalAgentTests/M3CatalogTests.swift
          test -f Tests/PersonalAgentTests/M3CompositionIsolationTests.swift
          test -f Tests/PersonalAgentTests/M3SemanticsTests.swift
          test -f Sources/Modules/Contracts/ModuleRuntime.swift
          test -f Sources/Modules/Contracts/ModuleCatalog.swift
          test -f Sources/Modules/Contracts/DeterministicModules.swift
          test -f Sources/Skills/Contracts/ToolModule.swift
          test -f Sources/Composition/M3CompositionRoot.swift
          test -f Documentation/M3.md
      - name: App does not import reserved engines
        run: |
          if grep -R "^import PAMemory" App; then
            echo "App must not import PAMemory"
            exit 1
          fi
          if grep -R "^import PAProvidersGrok\|^import PAProvidersOpenAI\|^import PAProvidersLocal" App; then
            echo "App must not import concrete providers"
            exit 1
          fi
      - name: Kernel does not import concrete providers
        run: |
          if grep -R "import PAProvidersGrok\|import PAProvidersOpenAI\|import URLSession" Sources/Core/Agent; then
            echo "Kernel isolation violated"
            exit 1
          fi
      - name: No committed secrets
        run: |
          if grep -R -E "sk-[A-Za-z0-9]{10,}|xai-[A-Za-z0-9]{10,}" --include='*.swift' --include='*.md' --include='*.yml' . | grep -v "sk-live-secret-DO-NOT-EMIT" | grep -v "sk-secret"; then
            echo "Possible secret committed"
            exit 1
          fi

  apple-build:
    name: iOS arm64 build & unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build PersonalAgent iOS app target (arm64)
        run: |
          xcodebuild build \
            -project PersonalAgent.xcodeproj \
            -scheme PersonalAgent \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned development IPA artifact
        run: |
          mkdir -p Payload
          APP_PATH=$(find DerivedData ~/Library/Developer/Xcode/DerivedData -name "PersonalAgent.app" -type d 2>/dev/null | head -n 1)
          test -n "$APP_PATH" || (echo "Error: PersonalAgent.app not found" && false)
          cp -R "$APP_PATH" Payload/
          zip -r PersonalAgent-unsigned.ipa Payload
          echo "Created PersonalAgent-unsigned.ipa successfully"

      - name: Upload unsigned development IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: PersonalAgent-iOS-unsigned-IPA
          path: PersonalAgent-unsigned.ipa
          retention-days: 14

  full-gate:
    name: Full Gate
    if: ${{ always() }}
    needs: [package-tests, repository-integrity, apple-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all validation jobs to pass
        run: |
          if [[ "${{ needs.package-tests.result }}" != "success" ||
                "${{ needs.repository-integrity.result }}" != "success" ||
                "${{ needs.apple-build.result }}" != "success" ]]; then
            echo "Full Gate FAILED"
            echo "Swift package tests: ${{ needs.package-tests.result }}"
            echo "Repository integrity: ${{ needs.repository-integrity.result }}"
            echo "iOS arm64 build: ${{ needs.apple-build.result }}"
            exit 1
          fi
          echo "Full Gate PASSED"
