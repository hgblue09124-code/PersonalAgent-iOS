name: Auto Repair (Guarded)

on:
  push:
    branches:
      - rearch/kernel-migration-2
  workflow_dispatch:
    inputs:
      attempt:
        description: "Repair loop attempt (0-based)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container: swift:6.3.2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize repair loop
        id: loop
        shell: bash
        env:
          INPUT_ATTEMPT: ${{ inputs.attempt || '0' }}
        run: |
          set -euo pipefail
          attempt="${INPUT_ATTEMPT:-0}"
          if ! [[ "$attempt" =~ ^[0-9]+$ ]]; then
            echo "Invalid repair attempt: $attempt"
            exit 1
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "AUTO-REPAIR: loop guard reached (3 attempts); STOP."
            echo "### Auto Repair\n- Result: STOP\n- Reason: loop guard reached" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Run tests and capture failure
        id: tests
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/swift-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop on green
        if: steps.tests.outputs.status == '0'
        shell: bash
        run: |
          echo "AUTO-REPAIR: tests GREEN; no repair required."
          {
            echo "### Auto Repair"
            echo "- Attempt: ${{ steps.loop.outputs.attempt }}"
            echo "- Result: GREEN"
            echo "- Action: STOP"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify and apply guarded repair
        id: repair
        if: steps.tests.outputs.status != '0'
        shell: python3
        env:
          LOG: /tmp/swift-test.log
        run: |
          import os, re, pathlib, subprocess, sys

          log = pathlib.Path(os.environ["LOG"]).read_text(errors="replace")
          manifest = pathlib.Path("Sources/Architecture/ArchitectureManifest.swift")
          text = manifest.read_text()

          # v1 allowlist: deterministic Kernel-migration import-boundary mismatch only.
          approved = {
              "PAProviders", "PASkills", "PAModules", "PAPolicy", "PACognition"
          }

          matches = re.findall(r'"(PA[A-Za-z0-9]+) imports PAKernel ([^)]*\)"', log)
          modules = sorted(set(m for m in matches if m in approved))

          if not modules:
              print("AUTO-REPAIR: classifier=UNKNOWN; no approved deterministic repair. STOP.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("### Auto Repair\\n- Classifier: UNKNOWN\\n- Result: STOP\\n")
              sys.exit(0)

          changed = []
          for module in modules:
              pattern = rf'("{re.escape(module)}": \\[[^\\]]*)\\]'
              match = re.search(pattern, text)
              if not match:
                  print(f"AUTO-REPAIR: manifest entry not found for {module}; STOP.")
                  sys.exit(1)
              entry = match.group(0)
              if '"PAKernel"' in entry:
                  continue
              replacement = entry[:-1] + ', "PAKernel"]'
              text = text[:match.start()] + replacement + text[match.end():]
              changed.append(module)

          if not changed:
              print("AUTO-REPAIR: classifier matched but patch is already applied; STOP.")
              sys.exit(0)

          manifest.write_text(text)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(manifest)], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)

          print("AUTO-REPAIR: classifier=DETERMINISTIC")
          print("AUTO-REPAIR: patch modules=", ",".join(changed))
          print("AUTO_REPAIR_MODULES=" + ",".join(changed))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Auto Repair\\n")
              out.write("- Classifier: DETERMINISTIC\\n")
              out.write("- Repair: ArchitectureManifest allowedImports -> PAKernel\\n")
              out.write("- Modules: " + ", ".join(changed) + "\\n")

      - name: Regression test repaired tree
        id: regression
        if: steps.tests.outputs.status != '0' && steps.repair.outcome == 'success'
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/regression.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "AUTO-REPAIR: regression test RED; refusing to commit."
            {
              echo "### Auto Repair"
              echo "- Regression test: RED"
              echo "- Action: STOP"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "AUTO-REPAIR: regression test GREEN."

      - name: Commit minimal repair
        id: commit
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "AUTO-REPAIR: no staged change; STOP."
            exit 0
          fi
          git commit -m "fix: auto-repair approved kernel migration imports [auto-repair]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "AUTO-REPAIR: repair committed."

      - name: Dispatch next guarded repair cycle
        if: steps.commit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.loop.outputs.attempt }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          next_attempt=$((ATTEMPT + 1))
          if [ "$next_attempt" -ge 3 ]; then
            echo "AUTO-REPAIR: max repair cycles reached after this patch; STOP."
            exit 0
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/auto-repair.yml/dispatches" \
            -d "{"ref":"${REF}","inputs":{"attempt":"${next_attempt}"}}"

          echo "AUTO-REPAIR: dispatched guarded cycle $next_attempt."
