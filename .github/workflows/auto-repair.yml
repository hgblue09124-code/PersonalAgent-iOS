name: Auto Repair (Guarded)

on:
  push:
    branches: [rearch/kernel-migration-2]
  workflow_dispatch:
    inputs:
      attempt:
        description: "Repair loop attempt (0-based)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-repair-${github.ref${
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') || github.event_name == 'workflow_dispatch' ${
    runs-on: ubuntu-latest
    container: swift:6.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize repair loop
        id: loop
        shell: bash
        env:
          INPUT_ATTEMPT: ${ inputs.attempt || '0' ${
        run: |
          set -euo pipefail
          attempt="$INPUT_ATTEMPT"
          [[ "$attempt" =~ ^[0-9]+$ ]] || { echo "Invalid repair attempt: $attempt"; exit 1; }
          if [ "$attempt" -ge 5 ]; then
            echo "AUTO-REPAIR: loop guard reached (5 attempts); STOP."
            exit 0
          fi
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Run tests and capture failure
        id: tests
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/swift-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop on green
        if: steps.tests.outputs.status == '0'
        shell: bash
        run: |
          echo "AUTO-REPAIR: tests GREEN; no repair required."
          echo "### Auto Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: GREEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify and apply guarded repair
        id: repair
        if: steps.tests.outputs.status != '0'
        shell: python3
        env:
          LOG: /tmp/swift-test.log
        run: |
          import os, re, pathlib, subprocess, sys

          log = pathlib.Path(os.environ["LOG"]).read_text(errors="replace")
          manifest = pathlib.Path("Sources/Architecture/ArchitectureManifest.swift")
          package = pathlib.Path("Package.swift")
          manifest_text = manifest.read_text()
          package_text = package.read_text()
          repairs = []

          # R1: duplicated consecutive .target( in Package.swift.
          duplicate = re.search(r'(\.target\(\s*)\.target\(', package_text)
          if duplicate:
              package_text = package_text[:duplicate.start()] + duplicate.group(1) + package_text[duplicate.end()-len('.target('):]
              package.write_text(package_text)
              repairs.append("Package.swift duplicate .target declaration")

          # R2: stale PAAgency dependency after target removal.
          if 'name: "PAAgency"' not in package_text and re.search(r'^\s*"PAAgency",\s*$', package_text, re.MULTILINE):
              package_text = re.sub(r'^\s*"PAAgency",\s*\n', '', package_text, flags=re.MULTILINE)
              package.write_text(package_text)
              repairs.append("Package.swift stale PAAgency dependency")

          # R3: known deterministic Kernel import-boundary allowlist.
          approved = {"PAProviders", "PASkills", "PAModules", "PAPolicy", "PACognition"}
          matches = re.findall(r'"(PA[A-Za-z0-9]+) imports PAKernel ([^)]*\)"', log)
          for module in sorted(set(m for m in matches if m in approved)):
              pattern = rf'("{re.escape(module)}": \[[^\]]*)\]'
              match = re.search(pattern, manifest_text)
              if not match:
                  print(f"AUTO-REPAIR: manifest entry missing for {module}; STOP.")
                  sys.exit(0)
              entry = match.group(0)
              if '"PAKernel"' not in entry:
                  manifest_text = manifest_text[:match.start()] + entry[:-1] + ', "PAKernel"]' + manifest_text[match.end():]
                  repairs.append(f"ArchitectureManifest allowedImports -> PAKernel ({module})")

          if not repairs:
              print("AUTO-REPAIR: UNKNOWN failure; STOP.")
              sys.exit(0)

          manifest.write_text(manifest_text)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","add","Package.swift","Sources/Architecture/ArchitectureManifest.swift"],check=True)
          subprocess.run(["git","diff","--cached","--check"],check=True)
          print("AUTO-REPAIR: DETERMINISTIC: " + " | ".join(repairs))

      - name: Regression test repaired tree
        id: regression
        if: steps.tests.outputs.status != '0' && steps.repair.outcome == 'success'
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/regression.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "AUTO-REPAIR: regression RED; refusing to commit."
            exit "$status"
          fi
          echo "AUTO-REPAIR: regression GREEN."

      - name: Verify canonical tree and package graph
        id: verify
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package >/tmp/package.json
          for path in Kernel Runtime/Agent Runtime/Execution Runtime/Planning Runtime/Observation Runtime/Verification Runtime/Result; do
            test -d "$path"
          done
          ! grep -R 'Sources/Core/Agency' -n Sources Runtime Tests Documentation 2>/dev/null
          ! grep -R 'PAAgency' -n Package.swift Tests Sources Runtime 2>/dev/null
          git diff --check
          echo "AUTO-REPAIR: canonical verification GREEN."

      - name: Commit minimal repair
        id: commit
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --quiet && { echo "AUTO-REPAIR: no staged change; STOP."; exit 0; }
          git commit -m "fix: auto-repair approved migration mechanics [auto-repair]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Dispatch next guarded repair cycle
        if: steps.commit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token ${
          ATTEMPT: ${ steps.loop.outputs.attempt ${
          REPO: ${{ github.repository ${
          REF: ${{ github.ref_name ${
        run: |
          set -euo pipefail
          next_attempt=$((ATTEMPT + 1))
          if [ "$next_attempt" -ge 5 ]; then exit 0; fi
          curl --fail-with-body -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/workflows/auto-repair.yml/dispatches"             -d '{"ref":"'$REF'","inputs":{"attempt":"'$next_attempt'"}}'
