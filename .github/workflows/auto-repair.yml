name: Auto Repair (Guarded)

on:
  push:
    branches:
      - "rearch/**"
  workflow_dispatch:
    inputs:
      attempt:
        description: "Repair loop attempt (0-based)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container: swift:6.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize repair loop
        id: loop
        shell: bash
        env:
          INPUT_ATTEMPT: ${{ inputs.attempt || '0' }}
        run: |
          set -euo pipefail
          attempt="$INPUT_ATTEMPT"
          [[ "$attempt" =~ ^[0-9]+$ ]] || { echo "Invalid repair attempt: $attempt"; exit 1; }
          if [ "$attempt" -ge 5 ]; then
            echo "AUTO-REPAIR: loop guard reached (5 attempts); STOP."
            exit 0
          fi
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Run tests and capture failure
        id: tests
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/swift-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stop on green
        if: steps.tests.outputs.status == '0'
        shell: bash
        run: |
          echo "AUTO-REPAIR: tests GREEN; no repair required."
          echo "### Auto Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: GREEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify and apply guarded repair
        id: repair
        if: steps.tests.outputs.status != '0'
        shell: bash
        env:
          LOG: /tmp/swift-test.log
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          log = pathlib.Path(os.environ["LOG"]).read_text(errors="replace")
          manifest = pathlib.Path("Sources/Architecture/ArchitectureManifest.swift")
          package = pathlib.Path("Package.swift")
          knowledge_path = pathlib.Path(".github/repair-knowledge.json")
          manifest_text = manifest.read_text()
          package_text = package.read_text()
          repairs = []

          fingerprints = []
          for match in re.finditer(r"no such module ['‘’\"]([^'‘’\"]+)['‘’\"]", log, re.I):
              fingerprints.append("no-such-module:" + match.group(1))
          for match in re.finditer(r"error: (.+)", log):
              message = re.sub(r"\s+", " ", match.group(1)).strip()
              if message:
                  fingerprints.append("error:" + message[:240])
          fingerprint = hashlib.sha256("|".join(sorted(set(fingerprints))).encode()).hexdigest()[:12] if fingerprints else ""

          knowledge = json.loads(knowledge_path.read_text()) if knowledge_path.exists() else {"version": 1, "approved": [], "candidates": []}
          approved = {entry["fingerprint"] for entry in knowledge.get("approved", [])}
          candidate_exists = any(entry.get("fingerprint") == fingerprint for entry in knowledge.get("candidates", []))

          recent = subprocess.run(
              ["git", "log", "-10", "--format=%s"],
              capture_output=True, text=True, check=True
          ).stdout
          if fingerprint and f"[auto-repair-fp:{fingerprint}]" in recent:
              print(f"AUTO-REPAIR: repeated identical failure {fingerprint}; STOP.")
              print("candidate already known:", candidate_exists)
              raise SystemExit(0)

          # R1: duplicated consecutive .target( in Package.swift.
          duplicate = re.search(r"(\.target\(\s*)\.target\(", package_text)
          if duplicate:
              package_text = (
                  package_text[:duplicate.start()]
                  + duplicate.group(1)
                  + package_text[duplicate.end() - len(".target("):]
              )
              package.write_text(package_text)
              repairs.append("Package.swift duplicate .target declaration")

          # R2: stale PAAgency dependency after target removal.
          if 'name: "PAAgency"' not in package_text and re.search(r'^\s*"PAAgency",\s*$', package_text, re.MULTILINE):
              package_text = re.sub(r'^\s*"PAAgency",\s*\n', "", package_text, flags=re.MULTILINE)
              package.write_text(package_text)
              repairs.append("Package.swift stale PAAgency dependency")

          # R5: stale dependency referencing a removed SwiftPM target.
          # Only acts when SwiftPM explicitly reports an unknown dependency and
          # the named target is absent. Removes exact dependency entries only.
          unknown_deps = sorted(set(re.findall(r"unknown dependency ['‘’\\\"]([^'‘’\\\"]+)['‘’\\\"] in target", log, re.I)))
          for module in unknown_deps:
              if not re.fullmatch(r"PA[A-Za-z0-9]+", module):
                  continue
              if re.search(rf'name:\s*"{re.escape(module)}"', package_text):
                  continue
              pattern = rf'^\\s*"{re.escape(module)}",\\s*$\\n?'
              package_text, changed = re.subn(pattern, "", package_text, flags=re.MULTILINE)
              if changed:
                  package.write_text(package_text)
                  repairs.append(f"remove stale SwiftPM dependency {module} ({changed} occurrence(s))")

          # R4: stale import of a removed module. This never substitutes a module.
          for module in sorted(set(re.findall(r"no such module ['‘’\"](PA[A-Za-z0-9]+)['‘’\"]", log, re.I))):
              if re.search(rf'name:\s*"{re.escape(module)}"', package_text):
                  continue
              changed = 0
              for root in ("Sources", "Runtime", "Kernel", "Capabilities", "Providers", "Memory", "Storage", "Composition", "App", "Tests"):
                  base = pathlib.Path(root)
                  if not base.exists():
                      continue
                  for path in base.rglob("*.swift"):
                      text = path.read_text(errors="replace")
                      new_text, count = re.subn(
                          rf'^\s*import\s+{re.escape(module)}\s*$\n?',
                          "",
                          text,
                          flags=re.MULTILINE,
                      )
                      if count:
                          path.write_text(new_text)
                          changed += count
              if changed:
                  repairs.append(f"remove stale import {module} ({changed} file(s))")

          # R3: known deterministic Kernel import-boundary allowlist.
          approved_modules = {"PAProviders", "PASkills", "PAModules", "PAPolicy", "PACognition"}
          matches = re.findall(r'"(PA[A-Za-z0-9]+) imports PAKernel ([^)]*\)"', log)
          for module in sorted(set(m for m in matches if m in approved_modules)):
              pattern = rf'("{re.escape(module)}": \[[^\]]*)\]'
              match = re.search(pattern, manifest_text)
              if not match:
                  print(f"AUTO-REPAIR: manifest entry missing for {module}; STOP.")
                  raise SystemExit(0)
              entry = match.group(0)
              if '"PAKernel"' not in entry:
                  manifest_text = manifest_text[:match.start()] + entry[:-1] + ', "PAKernel"]' + manifest_text[match.end():]
                  repairs.append(f"ArchitectureManifest allowedImports -> PAKernel ({module})")

          if not repairs:
              # Learning is observational only. Unknown failures are recorded as
              # candidates, never executed as new code.
              if fingerprint and not candidate_exists:
                  files = subprocess.run(
                      ["git", "diff", "--name-only"],
                      capture_output=True, text=True, check=True
                  ).stdout.splitlines()
                  knowledge.setdefault("candidates", []).append({
                      "fingerprint": fingerprint,
                      "pattern": sorted(set(fingerprints)),
                      "first_seen_commit": subprocess.run(
                          ["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True
                      ).stdout.strip(),
                      "status": "observed",
                      "execution": "forbidden",
                      "changed_files_at_observation": files[:50],
                  })
                  knowledge_path.parent.mkdir(parents=True, exist_ok=True)
                  knowledge_path.write_text(json.dumps(knowledge, indent=2, sort_keys=True) + "\n")
                  subprocess.run(["git", "add", str(knowledge_path)], check=True)
                  subprocess.run(["git", "diff", "--cached", "--check"], check=True)
                  subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
                  subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
                  subprocess.run(
                      ["git", "commit", "-m", f"chore: record repair candidate [auto-learning] [repair-candidate:{fingerprint}]"],
                      check=True,
                  )
                  subprocess.run(["git", "push", "origin", "HEAD:$GITHUB_REF_NAME"], check=True)
                  print(f"AUTO-LEARNING: recorded candidate {fingerprint}; execution remains forbidden.")
              else:
                  print("AUTO-REPAIR: UNKNOWN failure; STOP.")
              raise SystemExit(0)

          manifest.write_text(manifest_text)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "diff", "--cached", "--check"], check=True)
          if fingerprint:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"fingerprint={fingerprint}\n")
                  output.write("repaired=true\n")
          print("AUTO-REPAIR: DETERMINISTIC: " + " | ".join(repairs))
          PY

      - name: Regression test repaired tree
        id: regression
        if: steps.tests.outputs.status != '0' && steps.repair.outputs.repaired == 'true'
        shell: bash
        run: |
          set +e
          swift test --disable-sandbox 2>&1 | tee /tmp/regression.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "AUTO-REPAIR: regression RED; refusing to commit."
            exit "$status"
          fi
          echo "AUTO-REPAIR: regression GREEN."

      - name: Verify canonical tree and package graph
        id: verify
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package >/tmp/package.json
          for path in Kernel Runtime/Agent Runtime/Execution Runtime/Planning Runtime/Observation Runtime/Verification Runtime/Result; do
            test -d "$path"
          done
          ! grep -R 'Sources/Core/Agency' -n Sources Runtime Tests Documentation 2>/dev/null
          ! grep -R 'PAAgency' -n Package.swift Tests Sources Runtime 2>/dev/null
          git diff --check
          echo "AUTO-REPAIR: canonical verification GREEN."

      - name: Commit minimal repair
        id: commit
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --quiet && { echo "AUTO-REPAIR: no staged change; STOP."; exit 0; }
          git commit -m "fix: auto-repair approved migration mechanics [auto-repair] [auto-repair-fp:${{ steps.repair.outputs.fingerprint }}]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Dispatch next guarded repair cycle
        if: steps.commit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.loop.outputs.attempt }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          next_attempt=$((ATTEMPT + 1))
          if [ "$next_attempt" -ge 5 ]; then exit 0; fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/auto-repair.yml/dispatches" \
            -d '{"ref":"'$REF'","inputs":{"attempt":"'$next_attempt'"}}'
